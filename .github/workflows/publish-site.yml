name: Build and Deploy Slides

on:
  push:
    branches: [main]
    paths:
      - mutation-testing.md
      - .github/workflows/publish-site.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Slides
    runs-on: ubuntu-latest
    steps:
      - name: Checkout slides
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Render slides with Marp
        run: |
          npx --yes @marp-team/marp-cli@latest --html mutation-testing.md --output artifacts/slides/index.html
          npx --yes @marp-team/marp-cli@latest --html mutation-testing.md --pdf --output artifacts/slides/mutation-testing.pdf
      - name: Set up Pages
        uses: actions/configure-pages@v6
      - name: Upload slides
        uses: actions/upload-pages-artifact@v5
        with:
          path: artifacts/slides

  deploy:
    name: Deploy Website
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}
    needs: build
    steps:
      - id: deploy-pages
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
