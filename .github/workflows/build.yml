name: Build All Tutorial Branches

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Build ${{ matrix.branch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: [java/main, java/step1, java/step2, java/step3, java/step4]
    steps:
      - name: Prepare Maven build
        uses: sualeh/prepare-maven-build@v1.8.2
        with:
          java-version: 25
          checkout-branch: ${{ matrix.branch }}
      - name: Compile intentionally incomplete examples
        if: matrix.branch == 'java/main' || matrix.branch == 'java/step1'
        run: ./mvnw --no-transfer-progress --batch-mode test-compile
      - name: Run tests
        if: matrix.branch != 'java/main' && matrix.branch != 'java/step1'
        run: ./mvnw --no-transfer-progress --batch-mode test

  dotnet:
    name: Build ${{ matrix.branch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: [dotnet/main, dotnet/step1, dotnet/step2, dotnet/step3, dotnet/step4]
    steps:
      - name: Checkout example
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x
      - name: Build solution
        run: dotnet build Palindrome.sln
      - name: Discover intentionally failing tests
        if: matrix.branch == 'dotnet/main' || matrix.branch == 'dotnet/step1'
        run: dotnet test Palindrome.sln --no-build --list-tests
      - name: Run tests
        if: matrix.branch != 'dotnet/main' && matrix.branch != 'dotnet/step1'
        run: dotnet test Palindrome.sln --no-build
